<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probanden‑Terminbuchung</title>
<style>
body{font-family:Arial;margin:40px;background:#f5f5f5;}
.container{background:#fff;padding:20px;border-radius:8px;max-width:400px;margin:auto;}
input,select,button{width:100%;padding:8px;margin:6px 0;}
button{background:#007BFF;color:#fff;border:none;cursor:pointer;}
button:hover{background:#0056b3;}
#message{margin-top:10px;}
.small{font-size:0.8em;color:#666;}
</style>
</head>
<body>
<div class="container">
  <h2>Terminbuchung</h2>
  <form id="form">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="E‑Mail" required>
    <label>Wochentag auswählen:</label>
    <select id="slotSelect"></select>
    <button type="submit">Buchen</button>
  </form>
  <div id="message"></div>
  <div class="small" id="updated"></div>
</div>

<script>
const API_URL = "HIER_DEINE_API_URL_EINFÜGEN"; // <‑‑ ersetzen !

async function loadSlots(){
  try{
    const response = await fetch(API_URL);
    const slots = await response.json();
    const select = document.getElementById('slotSelect');
    select.innerHTML = "";
    slots.forEach(s=>{
      if(!s.bookedBy){                       // nur freie anzeigen
        const opt = document.createElement('option');
        opt.value = s.day;
        opt.textContent = `${s.day} ${s.start}‑${s.end} (${s.duration})`;
        select.appendChild(opt);
      }
    });
    document.getElementById('updated').textContent =
      "Letzte Aktualisierung: "+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('message').textContent="Fehler beim Laden.";
  }
}

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const day   = document.getElementById('slotSelect').value;
  if(!day){ alert("Bitte Wochentag auswählen."); return; }

  const res = await fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({ name, email, day })
  });
  const result = await res.json();
  document.getElementById('message').textContent = result.message;
  loadSlots();
});

loadSlots();
setInterval(loadSlots,60000); // alle 60 Sek. neu laden
</script>
</body>
</html>
